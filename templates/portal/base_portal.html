<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MYKHODYNKA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="portal-body {% block body_class %}{% endblock %}">
    <header class="topbar">
        <span class="topbar__logo">MYKHODYNKA</span>
        <a href="{{ url_for('auth.login') }}" class="topbar__exit">Выйти</a>
    </header>

    <main class="portal-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

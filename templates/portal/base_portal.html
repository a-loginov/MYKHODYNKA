<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MYKHODYNKA{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="portal-body {% block body_class %}{% endblock %}">
    <main class="portal-content">
        {% block content %}{% endblock %}
    </main>

    <nav class="bottom-nav" aria-label="Основная навигация">
        <a class="bottom-nav__item" href="{{ url_for('portal.dashboard') }}" data-nav="home">
            <span class="bottom-nav__icon" aria-hidden="true">🏠</span>
            <span class="bottom-nav__label">Главная</span>
        </a>
        <a class="bottom-nav__item" href="{{ url_for('portal.requests_page') }}" data-nav="requests">
            <span class="bottom-nav__icon" aria-hidden="true">🔧</span>
            <span class="bottom-nav__label">Заявки</span>
        </a>
        <a class="bottom-nav__item" href="{{ url_for('portal.passes') }}" data-nav="passes">
            <span class="bottom-nav__icon" aria-hidden="true">🚪</span>
            <span class="bottom-nav__label">Пропуска</span>
        </a>
        <a class="bottom-nav__item" href="{{ url_for('portal.messages') }}" data-nav="messages">
            <span class="bottom-nav__icon" aria-hidden="true">💬</span>
            <span class="bottom-nav__label">Сообщения</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

{# Компактный заголовок подстраницы (без большого ковра) — стиль как в референсе MY1409 #}
{% macro page_cover(title, subtitle='', icon='') %}
<div class="sub-head">
    <a href="{{ url_for('portal.dashboard') }}" class="sub-back" aria-label="Назад к сервисам">←</a>
    <div class="sub-head__icon" aria-hidden="true">{{ icon }}</div>
    <h1 class="sub-head__title">{{ title }}</h1>
    {% if subtitle %}<p class="sub-head__subtitle">{{ subtitle }}</p>{% endif %}
</div>
{% endmacro %}
